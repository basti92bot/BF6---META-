name: BF6 Rapid Royale hourly history

on:
  schedule:
    - cron: "11,41 * * * *"
    - cron: "7 7 * * *"
      timezone: "Europe/Berlin"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bf6-rapid-hourly
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate collector
        run: node scripts/test-rapid-history.mjs
      - name: Fetch Rapid Royale counters
        run: node scripts/collect-rapid-history.mjs
      - name: Save hourly snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rapid-history.json
          if ! git diff --cached --quiet; then
            git commit -m "data: record Rapid Royale hourly snapshots"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
