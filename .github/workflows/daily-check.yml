name: Daily BF6 source check

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compare EA patches and community measurements
        id: check
        continue-on-error: true
        run: node scripts/check-sources.mjs
      - name: Commit status and validated data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weapons.json data/status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: daily BF6 source check"
            git push
          fi
      - name: Flag failed source check
        if: steps.check.outcome == 'failure'
        run: |
          echo "::error::At least one Battlefield source check failed; see data/status.json"
          exit 1
